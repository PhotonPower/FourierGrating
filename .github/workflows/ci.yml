name: CI (CPU)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libeigen3-dev nlohmann-json3-dev libgtest-dev python3-numpy python3-matplotlib
      - name: Configure
        run: cmake --preset cpu-release -DFG_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset cpu-release
      - name: Unit tests
        run: ctest --preset cpu-release -L unit
      - name: Plot script smoke test
        run: python3 scripts/plot_nearfield.py --demo /tmp/nfdemo

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-lang-german lmodern
      - name: Build plan
        run: ./scripts/build_docs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: implementation-plan
          path: docs/implementation_plan/main.pdf
