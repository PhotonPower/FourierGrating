name: CI (CPU)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libeigen3-dev nlohmann-json3-dev libgtest-dev python3-numpy python3-matplotlib
      - name: Configure
        run: cmake --preset cpu-release -DFG_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset cpu-release
      - name: Unit tests
        run: ctest --preset cpu-release -L unit
      - name: Plot script smoke test
        run: python3 scripts/plot_nearfield.py --demo /tmp/nfdemo

  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libeigen3-dev nlohmann-json3-dev libgtest-dev
      - name: Build
        run: cmake --preset cpu-release && cmake --build --preset cpu-release --target test_regression
      - name: Golden files (other compiler, 1e-13 of the incident power)
        run: ctest --preset cpu-release -L regression

  tsan:
    # ThreadSanitizer (M15): parallel slices, tree reduction, scan, lazy layer models. Without OpenMP,
    # parallelFor runs on std::thread, which TSAN sees completely (libgomp is not instrumented).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libeigen3-dev nlohmann-json3-dev libgtest-dev
      - name: Build
        run: cmake --preset cpu-tsan && cmake --build --preset cpu-tsan
      - name: Unit tests under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
          FG_NUM_THREADS: "4"
        run: ctest --preset cpu-tsan -L unit --timeout 3000

  cad:
    # CAD slicer (M14): FG_ENABLE_NURBFORGE=ON (Nurbforge v0.6.0 via FetchContent)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libeigen3-dev nlohmann-json3-dev libgtest-dev
      - name: Build
        run: cmake --preset cpu-cad -DFG_WARNINGS_AS_ERRORS=ON && cmake --build --preset cpu-cad
      - name: CAD tests, unit tests, golden files
        run: ctest --preset cpu-cad -L "unit|regression" && ctest --preset cpu-cad -R "CAD|cad_pillar"

  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset win-msvc -DFG_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset win-msvc
      - name: Unit and regression tests
        run: ctest --preset win-msvc -L "unit|regression"

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[test]"
      - name: pytest
        run: python -m pytest tests/python

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-lang-german lmodern
      - name: Build plan
        run: ./scripts/build_docs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: implementation-plan
          path: docs/implementation_plan/main.pdf
