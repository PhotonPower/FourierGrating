name: Wheels

# Plan section "M12: Build": manylinux_2_28 x86_64 and Windows (MSVC) for CPython 3.10-3.13; the CUDA
# distribution fouriergrating-cuda12 for Windows (built without GPU, accepted on the user's machine).
# Release: a tag v<version> (= CMakeLists.txt) builds wheels, sdist and the handbook and attaches them to a
# GitHub release. PyPI only by hand: "Run workflow" on the tag with pypi = true (Trusted Publishing:
# project fouriergrating with environment "pypi", fouriergrating-cuda12 with environment "pypi-cuda12").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      pypi:
        description: "Upload to PyPI (run on a tag v*)"
        type: boolean
        default: false

jobs:
  cpu:
    name: fouriergrating (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_ARCHS: auto64
          CIBW_SKIP: "*-musllinux*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # MSVC OpenMP runtime (vcomp140.dll) into the wheel; auditwheel bundles libgomp on Linux
          CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair -w {dest_dir} {wheel}
          # fresh venv per wheel: import and a fast subset of the Python tests
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "import fouriergrating as fg; print(fg.__version__, fg.core_variant())" &&
            pytest {project}/tests/python -k "simulation or solve_is_first or errors or structure"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cpu-${{ matrix.os }}
          path: wheelhouse/*.whl

  cuda12-windows:
    name: fouriergrating-cuda12 (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.3"   # cusolverDnXgeev needs >= 12.6 Update 2
          method: network
          sub-packages: '["cudart", "cublas", "cublas_dev", "cusolver", "cusolver_dev", "nvcc"]'
      - uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: python/cuda12
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_ARCHS: AMD64
          CIBW_TEST_SKIP: "*"   # no GPU in CI; acceptance on the Windows machine (docs/benchmarks.md)
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cuda12-windows
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  handbook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-lang-german lmodern
      - run: ./scripts/build_docs.sh
      - run: cp docs/handbuch/handbuch.pdf FourierGrating-Benutzerhandbuch.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: handbook
          path: FourierGrating-Benutzerhandbuch.pdf

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [cpu, cuda12-windows, sdist, handbook]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag equals the version in CMakeLists.txt
        run: |
          v=$(sed -n 's/^project(FourierGrating VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "$GITHUB_REF_NAME" = "v$v" || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release with the CHANGELOG section of the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v h="## [${GITHUB_REF_NAME#v}]" 'index($0, h) == 1 {f = 1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "FourierGrating ${GITHUB_REF_NAME#v}" --notes-file notes.md

  # one Trusted Publisher per project: PyPI accepts a pending publisher (owner, repository, workflow,
  # environment) only once, hence two environments
  pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.pypi && startsWith(github.ref, 'refs/tags/v')
    needs: [cpu, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-cpu-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  pypi-cuda12:
    if: github.event_name == 'workflow_dispatch' && inputs.pypi && startsWith(github.ref, 'refs/tags/v')
    needs: [cuda12-windows, pypi]
    runs-on: ubuntu-24.04
    environment: pypi-cuda12
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-cuda12-windows
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
